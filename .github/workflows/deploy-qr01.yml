name: Qr01 Preview

permissions:
  contents: read
  actions: write

on:
  push:
    branches: [qr01]
  workflow_dispatch:
    inputs:
      domain:
        description: Preview custom domain
        required: false
        default: qr01.le-space.de

# Two jobs from deploy-acl01.yml are deliberately absent.
#
# "Resolve production bootstrap snapshot" used to be absent here, so that baking
# an address in could not let the offline test pass *through* a relay. It runs
# now: `e2e` is a separate job ahead of the build, and the isolated mode it uses
# sets VITE_NODE_ENV to development, so that app reads the DEV address and never
# sees the baked one. Without the step there was nothing to try before asking
# Aleph, which made a public directory a dependency of connecting at all.
#
# "start-remote-replication" provisions an ephemeral Aleph VM relay and
# replicates through it. That is precisely the thing qr01 does without, so
# running it here would test another chapter's premise against this one's site.
jobs:
  e2e:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: QR handover and offline PWA
        # isolated, not the default `local`: that mode starts a relay and hands
        # the app its address, and every assertion in this spec could then pass
        # *through* the relay while claiming two devices met by nothing but a
        # scanned code. isolated starts no relay and configures no bootstrap
        # address, which is the condition the chapter is actually about.
        env:
          E2E_RELAY_MODE: isolated
        run: pnpm exec playwright test e2e/qr01-transfer.spec.js e2e/offline-pwa.spec.js --project=chromium --workers=1

  build-and-deploy:
    needs: e2e
    runs-on: ubuntu-latest
    outputs:
      ipfs_cid: ${{ steps.publish.outputs.ipfs_cid }}
      ipfs_cid_v0: ${{ steps.publish.outputs.ipfs_cid_v0 }}
      item_hash: ${{ steps.publish.outputs.item_hash }}
      store_processed: ${{ steps.publish.outputs.store_processed }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `resolve-aleph-bootstrap.mjs` has been in this branch all along and
      # nothing called it - which is why no address was ever baked in, not a
      # missing script. It discovers the current relays, proves one with a real
      # libp2p ping, and writes VITE_RELAY_BOOTSTRAP_ADDR_PROD. `main` invokes it
      # exactly like this.
      #
      # The header of this file says the step is deliberately absent, because
      # baking an address in "would let the offline test pass through a relay".
      # That no longer holds: `e2e` is a separate job that runs before this one
      # and builds its own app, and `createPreviewEnv` sets VITE_NODE_ENV to
      # development for the isolated mode - so the app reads
      # RELAY_BOOTSTRAP_ADDR_DEV there and never sees this.
      - name: Resolve production bootstrap snapshot
        run: node scripts/resolve-aleph-bootstrap.mjs

      - name: Build qr01 preview
        env:
          VITE_NODE_ENV: production
          VITE_APP_BRANCH: qr01
        run: pnpm build
      - name: Install isolated Aleph deploy tooling
        run: npm install --prefix /tmp/le-space-deployer @le-space/node@0.6.22 --ignore-scripts
      - name: Publish preview to Aleph IPFS
        id: publish
        env:
          ALEPH_VM_MODE: site-publish
          ALEPH_SITE_DIRECTORY: ${{ github.workspace }}/build
          ALEPH_SITE_PIN: 'true'
          ALEPH_SITE_NAME: simple-todo-qr01
          ALEPH_SITE_CHANNEL: ALEPH-CLOUDSOLUTIONS
          ALEPH_PRIVATE_KEY: ${{ secrets.ALEPH_PRIVATE_KEY }}
        run: |
          for attempt in 1 2 3; do
            if node --input-type=module -e "import('/tmp/le-space-deployer/node_modules/@le-space/node/index.js').then((m) => m.runSiteMode())"; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 15))
          done

  link-domain:
    needs: build-and-deploy
    if: needs.build-and-deploy.outputs.item_hash != '' && needs.build-and-deploy.outputs.store_processed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm install --prefix /tmp/le-space-deployer @le-space/node@0.6.22 --ignore-scripts
      - name: Link qr01 preview domain
        env:
          ALEPH_VM_MODE: site-domain-link
          ALEPH_SITE_ITEM_HASH: ${{ needs.build-and-deploy.outputs.item_hash }}
          ALEPH_SITE_IPFS_CID: ${{ needs.build-and-deploy.outputs.ipfs_cid }}
          ALEPH_SITE_IPFS_CID_V0: ${{ needs.build-and-deploy.outputs.ipfs_cid_v0 }}
          ALEPH_SITE_DOMAIN: ${{ inputs.domain || 'qr01.le-space.de' }}
          ALEPH_SITE_DOMAIN_CATCH_ALL_PATH: /index.html
          ALEPH_PRIVATE_KEY: ${{ secrets.ALEPH_PRIVATE_KEY }}
        run: node --input-type=module -e "import('/tmp/le-space-deployer/node_modules/@le-space/node/index.js').then((m) => m.runSiteMode())"

  # The chapter's claim, stretched across two networks.
  #
  # `main` runs this scenario through a public relay, which needs a bootstrap
  # address baked into the build. qr01 bakes none, so it runs the `qr01`
  # scenario instead: one browser draws the code, the other scans it, and the
  # harness carries the string between them the way a camera would. No relay,
  # no bootstrap list, no discovery — the same introduction the chapter is
  # about, with the one thing a single machine cannot fake: real distance.
  #
  # `require_public_relay: false` because there is no relay to hold a
  # connection to, and asserting one would fail on purpose.
  remote-qr-handover:
    needs: link-domain
    uses: ./.github/workflows/remote-replication.yml
    secrets: inherit
    with:
      app_url: https://${{ inputs.domain || 'qr01.le-space.de' }}
      provider: aleph
      scenario: qr01
      require_public_relay: false
