# What a change to this chapter has to survive before it lands.
#
# Until now, nothing did — and here that is literal. `acl01` and `collab01` at
# least ran their tests *after* a merge, through their deploy workflow. This
# chapter has no workflow of its own at all: no `deploy-privacy01.yml`, and no
# other file names this branch. Every pull request into `privacy01` so far ran
# exactly one check, GitGuardian, a secret scanner. The encryption this chapter
# is about was merged three times without a single test being executed by
# anything but a person running them by hand.
#
# Ported from the same file on `acl01`, which this chapter is branched from,
# rather than written again — the difference between the chapters should be
# what they teach, not how they are tested.
name: Tests

permissions:
  contents: read

on:
  pull_request:
    branches: [privacy01]
  workflow_dispatch:

# A pull request pushed to twice does not need the first run to finish.
concurrency:
  group: tests-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    timeout-minutes: 20
    steps:
      - name: Checkout simple-todo
        uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Static and instant. A preview origin written down by hand makes a spec
      # browse to whatever is already on that port, so it can pass or fail
      # against a build nobody asked it to test.
      - name: No preview origin is written down by hand
        run: pnpm run check:preview-origin

      # The chapter's own proofs live here: the sealer and the passthrough that
      # keeps entries written before encryption readable. Seconds, so they go
      # first.
      - name: Unit tests
        run: pnpm run test:unit

      # The four inherited from `acl01`. They matter more here than there:
      # `private-list-visibility` and `acl-permissions` both exercise a private
      # list, which is exactly what this chapter is about to seal — so they are
      # the measurement that says whether switching encryption on breaks the
      # chapter it is switched on in. Run against this branch they pass, and
      # against the branch that switches it on two of them do not. That is the
      # finding this workflow exists to surface.
      #
      # `passkey-identity.spec.js` is deliberately absent, as on `acl01`: it
      # fails about half the time there regardless of parallelism, and a spec
      # that flaky teaches people to ignore red.
      - name: Browser specs
        run: >-
          pnpm exec playwright test
          e2e/acl-permissions.spec.js
          e2e/consent-screen.spec.js
          e2e/list-registry.spec.js
          e2e/private-list-visibility.spec.js
          --project=chromium
