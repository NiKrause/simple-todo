# What a change to this chapter has to survive before it lands.
#
# Ported from `privacy01`, which this chapter is branched from — the
# difference between the chapters should be what they teach, not how they
# are tested. This chapter adds one spec of its own, `delegation.spec.js`,
# and the unit tests for the delegation rules in `src/lib/delegation.spec.js`.
name: Tests

permissions:
  contents: read

on:
  pull_request:
    branches: [delegation01]
  workflow_dispatch:

# A pull request pushed to twice does not need the first run to finish.
concurrency:
  group: tests-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    timeout-minutes: 20
    steps:
      - name: Checkout simple-todo
        uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Static and instant. A preview origin written down by hand makes a spec
      # browse to whatever is already on that port, so it can pass or fail
      # against a build nobody asked it to test.
      - name: No preview origin is written down by hand
        run: pnpm run check:preview-origin

      # The chapter's own rules — who may act on a delegated todo, and how
      # revoke and expiry fold a delegate's actions back out — plus the
      # privacy01 sealer tests this branch inherits. Seconds, so they go first.
      - name: Unit tests
        run: pnpm run test:unit

      # `delegation.spec.js` is this chapter: three passkey identities, one
      # delegated todo, and the revoke and expiry paths. The four after it are
      # inherited from `acl01`/`privacy01`; `acl-permissions` and
      # `private-list-visibility` matter most, because the delegation
      # controller now stands in for the built-in one on every private list
      # and must leave owner-only writes and grants exactly as they were.
      #
      # `passkey-identity.spec.js` is deliberately absent, as on `acl01`: it
      # fails about half the time there regardless of parallelism, and a spec
      # that flaky teaches people to ignore red.
      - name: Browser specs
        run: >-
          pnpm exec playwright test
          e2e/delegation.spec.js
          e2e/acl-permissions.spec.js
          e2e/consent-screen.spec.js
          e2e/list-registry.spec.js
          e2e/private-list-visibility.spec.js
          --project=chromium
