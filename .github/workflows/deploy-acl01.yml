name: Acl01 Preview

permissions:
  contents: read
  actions: write

on:
  push:
    branches: [acl01]
  workflow_dispatch:
    inputs:
      relay_bootstrap_addr:
        description: Optional comma-separated production relay multiaddresses
        required: false
        default: ''
      domain:
        description: Preview custom domain
        required: false
        default: acl01.le-space.de

jobs:
  e2e:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: DID write-permissions two-browser test
        run: pnpm exec playwright test e2e/acl-permissions.spec.js --project=chromium

  build-and-deploy:
    needs: e2e
    runs-on: ubuntu-latest
    outputs:
      ipfs_cid: ${{ steps.publish.outputs.ipfs_cid }}
      ipfs_cid_v0: ${{ steps.publish.outputs.ipfs_cid_v0 }}
      item_hash: ${{ steps.publish.outputs.item_hash }}
      store_processed: ${{ steps.publish.outputs.store_processed }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Resolve production bootstrap snapshot
        env:
          RELAY_BOOTSTRAP_OVERRIDE: ${{ inputs.relay_bootstrap_addr || '' }}
        run: node scripts/resolve-aleph-bootstrap.mjs
      - name: Build acl01 preview
        env:
          VITE_NODE_ENV: production
          VITE_APP_BRANCH: acl01
        run: pnpm build
      - name: Install isolated Aleph deploy tooling
        run: npm install --prefix /tmp/le-space-deployer @le-space/node@0.6.22
      - name: Publish preview to Aleph IPFS
        id: publish
        env:
          ALEPH_VM_MODE: site-publish
          ALEPH_SITE_DIRECTORY: ${{ github.workspace }}/build
          ALEPH_SITE_PIN: 'true'
          ALEPH_SITE_NAME: simple-todo-acl01
          ALEPH_SITE_CHANNEL: ALEPH-CLOUDSOLUTIONS
          ALEPH_PRIVATE_KEY: ${{ secrets.ALEPH_PRIVATE_KEY }}
        run: |
          for attempt in 1 2 3; do
            if node --input-type=module -e "import('/tmp/le-space-deployer/node_modules/@le-space/node/index.js').then((m) => m.runSiteMode())"; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 15))
          done

  link-domain:
    needs: build-and-deploy
    if: needs.build-and-deploy.outputs.item_hash != '' && needs.build-and-deploy.outputs.store_processed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm install --prefix /tmp/le-space-deployer @le-space/node@0.6.22
      - name: Link acl01 preview domain
        env:
          ALEPH_VM_MODE: site-domain-link
          ALEPH_SITE_ITEM_HASH: ${{ needs.build-and-deploy.outputs.item_hash }}
          ALEPH_SITE_IPFS_CID: ${{ needs.build-and-deploy.outputs.ipfs_cid }}
          ALEPH_SITE_IPFS_CID_V0: ${{ needs.build-and-deploy.outputs.ipfs_cid_v0 }}
          ALEPH_SITE_DOMAIN: ${{ inputs.domain || 'acl01.le-space.de' }}
          ALEPH_SITE_DOMAIN_CATCH_ALL_PATH: /index.html
          ALEPH_PRIVATE_KEY: ${{ secrets.ALEPH_PRIVATE_KEY }}
        run: node --input-type=module -e "import('/tmp/le-space-deployer/node_modules/@le-space/node/index.js').then((m) => m.runSiteMode())"

  # Dispatched as a separate run rather than called with `uses:`, mirroring
  # collab01: replication provisions an ephemeral Aleph VM and takes far longer
  # than the deploy, so gating the preview on it would leave the chapter
  # undeployed for the duration of a test that is about the deployed site.
  #
  # Unlike collab01 the URL follows the `domain` input, so dispatching this
  # workflow with a custom domain tests the site that was actually linked
  # instead of the default one.
  start-remote-replication:
    needs: link-domain
    runs-on: ubuntu-latest
    steps:
      - name: Start remote replication against the preview
        env:
          GH_TOKEN: ${{ github.token }}
          APP_URL: https://${{ inputs.domain || 'acl01.le-space.de' }}
        run: >-
          gh workflow run remote-replication.yml
          --repo "${{ github.repository }}"
          --ref acl01
          -f app_url="${APP_URL}"
          -f provider=aleph
