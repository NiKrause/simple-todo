name: Remote browser replication

on:
  workflow_call:
    inputs:
      app_url:
        description: Public deployment URL produced by the calling workflow
        required: true
        type: string
      provider:
        description: Second browser provider
        required: false
        type: string
        default: aleph
  workflow_dispatch:
    inputs:
      app_url:
        description: Public main deployment URL
        required: true
        default: https://simple-todo.le-space.de
      provider:
        description: Second browser provider
        required: true
        type: choice
        options:
          - aleph
          - local
        default: aleph

permissions:
  contents: read

jobs:
  main-remote-replication:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    concurrency:
      group: simple-todo-aleph-playwright-${{ github.ref }}
      cancel-in-progress: false
    env:
      REMOTE_APP_URL: ${{ inputs.app_url }}
      REMOTE_PROVIDER: ${{ inputs.provider }}
      REQUIRE_PUBLIC_RELAY: 'true'
      ALEPH_VM_PRIVATE_KEY: ${{ secrets.ALEPH_PLAYWRIGHT_PRIVATE_KEY || secrets.RELAY_BUTTON_E2E_PRIVATE_KEY }}
      # Display label for the evidence summary only — it does not steer CRN
      # selection. Kept truthful: placement is unpinned so the ranker can
      # shuffle its top pool instead of always picking the same node.
      ALEPH_PLAYWRIGHT_REGION: unpinned
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install local Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Create per-run SSH identity and browser secret
        if: inputs.provider == 'aleph'
        id: credentials
        run: |
          secret="$(openssl rand -hex 32)"
          echo "::add-mask::$secret"
          echo "secret=$secret" >> "$GITHUB_OUTPUT"
          ssh-keygen -q -t ed25519 -N '' -f "$RUNNER_TEMP/aleph-playwright-id"
          echo "ALEPH_PLAYWRIGHT_SSH_KEY=$RUNNER_TEMP/aleph-playwright-id" >> "$GITHUB_ENV"
          echo "ssh_public_key=$(cat "$RUNNER_TEMP/aleph-playwright-id.pub")" >> "$GITHUB_OUTPUT"

      # Replaces six hand-written steps (VM deploy, mapped-port resolution,
      # per-run TLS certificate, SSH injection of the runner config, service
      # start, authenticated /version check). The shared action performs all of
      # them, and forwards the same aleph-vm-deploy settings this workflow used
      # to pass by hand — profile, api_hosts, rootfs_version playwright-1.61.1,
      # rootfs_size_mib 20480, auto_configure false, verify_reachability false,
      # publish_port_forwards true, and the identical required_ports_json for
      # 22 and 443. Nothing below is a behaviour change except the readiness
      # check, which the action additionally repeats from the runner through the
      # mapped port with `--cacert` rather than only in-guest over `--insecure`.
      - name: Deploy and configure authenticated runner
        if: inputs.provider == 'aleph'
        id: runner
        uses: NiKrause/relay-button/.github/actions/aleph-playwright-runner@main
        with:
          aleph_private_key: ${{ env.ALEPH_VM_PRIVATE_KEY }}
          name: simple-todo-${{ github.run_id }}-${{ github.run_attempt }}
          ssh_public_key: ${{ steps.credentials.outputs.ssh_public_key }}
          ssh_private_key_path: ${{ env.ALEPH_PLAYWRIGHT_SSH_KEY }}
          secret: ${{ steps.credentials.outputs.secret }}
          # Republished 2026-08-01 by relay-button's Playwright Runner RootFS
          # workflow. The previous pin (c392fba3…) no longer resolves on either
          # Aleph replica, so every INSTANCE was rejected with error 301
          # (referenced message missing). Same image contents — the manifest
          # reports playwrightVersion 1.61.1 either way.
          rootfs_item_hash: 'b41c7fe9fe687a22f37f52b52d008a9a924280faec04591ecf47976038f065be'
          # The next three match the action's own defaults today. Passed
          # explicitly anyway: each records a failure mode this workflow hit,
          # and a default that changes upstream must not silently change how
          # this run places its VM.
          #
          # Manual placement is what gives us CRN failover at all. Scheduler
          # placement builds exactly one candidate ("attempting scheduler
          # placement 1/1"), so a node that reserves the proxy slot and never
          # boots the VM fails the whole run — and max_crn_attempts, which only
          # shapes the manual candidate list, stays inert.
          placement_strategy: manual
          # Five is the size of the ranker's shuffled top pool; going past it
          # lets failover walk into the ordered tail (6th, 7th, 8th). This is
          # the one value that differs from the action's default of 5.
          max_crn_attempts: '8'
          # Empty on purpose: any preference switches the ranker to
          # deterministic geo-first ordering and disables the top-5 shuffle,
          # sending every run at the same congested node.
          preferred_country_code: ''
          vcpus: '2'
          memory_mib: '4096'

      - name: Export Aleph runtime env vars
        if: inputs.provider == 'aleph'
        run: |
          echo "ALEPH_PLAYWRIGHT_SECRET=${{ steps.credentials.outputs.secret }}" >> "$GITHUB_ENV"
          echo "ALEPH_PLAYWRIGHT_WS_ENDPOINT=${{ steps.runner.outputs.ws_endpoint }}" >> "$GITHUB_ENV"
          echo "ALEPH_PLAYWRIGHT_VERSION_URL=${{ steps.runner.outputs.version_url }}" >> "$GITHUB_ENV"
          echo "ALEPH_PLAYWRIGHT_INSTANCE_HASH=${{ steps.runner.outputs.instance_item_hash }}" >> "$GITHUB_ENV"
          echo "ALEPH_PLAYWRIGHT_CRN_HASH=${{ steps.runner.outputs.crn_hash }}" >> "$GITHUB_ENV"
          echo "ALEPH_PLAYWRIGHT_CRN_NAME=${{ steps.runner.outputs.crn_name }}" >> "$GITHUB_ENV"
          echo "NODE_EXTRA_CA_CERTS=${{ steps.runner.outputs.ca_cert_path }}" >> "$GITHUB_ENV"

      - name: Run cross-network main replication
        run: pnpm run test:e2e:remote:main

      # Not provided by the shared action, and the only view into why a guest
      # failed after it was handed over.
      - name: Collect Aleph guest logs on failure
        if: failure() && inputs.provider == 'aleph'
        env:
          ALEPH_PLAYWRIGHT_HOST: ${{ steps.runner.outputs.host_ipv4 }}
          ALEPH_PLAYWRIGHT_SSH_PORT: ${{ steps.runner.outputs.ssh_port }}
        run: |
          ssh -i "$ALEPH_PLAYWRIGHT_SSH_KEY" \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=20 \
            -p "$ALEPH_PLAYWRIGHT_SSH_PORT" \
            "root@$ALEPH_PLAYWRIGHT_HOST" \
            'journalctl --no-pager --lines=200 -u playwright-runner-bootstrap.service -u playwright-runner.service -u playwright-runner-proxy.service' \
            > "${{ runner.temp }}/aleph-guest-logs.txt" 2>&1 || true

      # The shared cleanup replaces `scripts/cleanup-aleph-instance.mjs`, which
      # threw "Cleanup requires one exact INSTANCE hash" whenever the deploy
      # produced no INSTANCE — a failed deploy therefore reported two errors,
      # and the second one buried the first. The action skips instead, because
      # aleph-vm-deploy already forgets its own failed deployment.
      - name: Erase and forget exact Aleph INSTANCE
        if: always() && inputs.provider == 'aleph'
        id: cleanup
        uses: NiKrause/relay-button/.github/actions/aleph-playwright-runner-cleanup@main
        with:
          aleph_private_key: ${{ env.ALEPH_VM_PRIVATE_KEY }}
          instance_item_hash: ${{ steps.runner.outputs.instance_item_hash }}

      - name: Upload remote replication evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: remote-main-replication-${{ github.run_id }}
          path: |
            test-results/remote-main
            ${{ runner.temp }}/aleph-guest-logs.txt
            ${{ steps.cleanup.outputs.evidence_path }}
          if-no-files-found: warn
          retention-days: 14
