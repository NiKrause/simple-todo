<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<!-- Theme init (before paint) — set light/dark from stored choice or system pref -->
		<script>
			(function () {
				try {
					var t = localStorage.getItem('theme');
					if (t !== 'light' && t !== 'dark') {
						t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
					}
					document.documentElement.classList.toggle('dark', t === 'dark');
					document.documentElement.style.background = t === 'dark' ? '#0B0E15' : '#EDF1F8';
				} catch (e) {}
			})();
		</script>

		<!-- Favicon and Icons -->
		<link rel="icon" type="image/svg+xml" href="./favicon.svg" />
		<link rel="icon" type="image/x-icon" href="./favicon.ico" />
		<link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png" />
		<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png" />
		<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
		<link rel="manifest" href="./manifest.json" />
		<meta name="theme-color" content="#0B0E15" />

		<!-- SEO Meta Tags -->
		<title>Simple-Todo — A Local-First Peer-to-Peer TODO</title>
		<meta
			name="description"
			content="Simple-Todo — a local-first peer-to-peer todo list. No servers, no accounts, no passwords — data you own. Built with OrbitDB, IPFS and libp2p."
		/>
		<meta name="author" content="Nico Krause" />
		<meta
			name="keywords"
			content="peer-to-peer, local-first, libp2p, todo, list, orbitdb, ipfs, decentralized, p2p, le-space"
		/>

		<!-- Open Graph / Facebook / Telegram -->
		<meta property="og:type" content="website" />
		<meta property="og:url" content="https://simple-todo.le-space.de/" />
		<meta property="og:title" content="Simple-Todo — A Local-First Peer-to-Peer TODO" />
		<meta
			property="og:description"
			content="A local-first peer-to-peer todo list. No servers, no accounts, no passwords — data you own. OrbitDB · IPFS · libp2p."
		/>
		<meta property="og:image" content="https://simple-todo.le-space.de/og-image.png" />
		<meta property="og:image:type" content="image/png" />
		<meta
			property="og:image:alt"
			content="Simple-Todo — a local-first peer-to-peer todo list, on the Le-Space stack"
		/>
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:site_name" content="Simple-Todo" />
		<meta property="og:locale" content="en_US" />

		<!-- Twitter -->
		<meta property="twitter:card" content="summary_large_image" />
		<meta property="twitter:url" content="https://simple-todo.le-space.de/" />
		<meta property="twitter:title" content="Simple-Todo — A Local-First Peer-to-Peer TODO" />
		<meta
			property="twitter:description"
			content="A local-first peer-to-peer todo list. No servers, no accounts, no passwords — data you own. OrbitDB · IPFS · libp2p."
		/>
		<meta property="twitter:image" content="https://simple-todo.le-space.de/og-image.png" />
		<meta
			property="twitter:image:alt"
			content="Simple-Todo — a local-first peer-to-peer todo list, on the Le-Space stack"
		/>

		<!-- Additional Meta Tags -->
		<meta name="application-name" content="Simple-Todo" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Simple-Todo" />
		<meta name="msapplication-TileColor" content="#0B0E15" />
		<meta name="msapplication-config" content="./browserconfig.xml" />

		<!-- Consolidate ranking here: the tutorial chapters are deployed from
		     near-identical sources to their own subdomains and canonicalise to this
		     URL. -->
		<link rel="canonical" href="https://simple-todo.le-space.de/" />

		<!-- Technical Meta Tags -->
		<meta name="format-detection" content="telephone=no" />
		<meta name="robots" content="index, follow" />
		<meta name="googlebot" content="index, follow" />

		<!-- Schema.org markup -->
		<meta itemprop="name" content="Simple-Todo — A Local-First Peer-to-Peer TODO" />
		<meta
			itemprop="description"
			content="A local-first peer-to-peer todo list using OrbitDB, IPFS and libp2p. No servers, no accounts, no passwords — data you own."
		/>
		<meta itemprop="image" content="https://simple-todo.le-space.de/og-image.png" />

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
